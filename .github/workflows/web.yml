name: Build and deploy Tashkent RP Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install Godot and Web export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: true
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Export browser game
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          touch build/web/.nojekyll
      - name: Publish versioned files to avoid stale browser cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import os
          import shutil

          root = Path("build/web")
          version = os.environ["GITHUB_SHA"][:12]
          release = root / "releases" / version
          release.mkdir(parents=True, exist_ok=True)
          for item in list(root.iterdir()):
              if item.name in ("releases", ".nojekyll"):
                  continue
              shutil.move(str(item), str(release / item.name))
          url = f"./releases/{version}/"
          page = (
              '<!doctype html><html lang="uz"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>ULTIMATE TASHKENT RP</title>'
              f'<meta http-equiv="refresh" content="0;url={html.escape(url)}">'
              '</head><body style="background:#142032;color:white;font:18px sans-serif;padding:2rem">'
              '<p>ULTIMATE TASHKENT RP ochilmoqda...</p>'
              f'<p><a style="color:#8ce0ff" href="{html.escape(url)}">O‘yinni ochish</a></p>'
              f'<script>location.replace({url!r})</script></body></html>'
          )
          (root / "index.html").write_text(page, encoding="utf-8")
          # GitHub Pages serves 404.html for obsolete versioned links.
          # Send users back to the stable URL, which selects the newest build.
          fallback = (
              '<!doctype html><html lang="uz"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>ULTIMATE TASHKENT RP - yangilangan manzil</title>'
              '<meta http-equiv="refresh" content="0;url=/ultimate-tashkent-rp/">'
              '</head><body style="background:#142032;color:white;font:18px sans-serif;padding:2rem">'
              '<p>O\u2018yin yangi versiyaga yangilandi. Yo\u2018naltirilmoqda...</p>'
              '<p><a style="color:#8ce0ff" href="/ultimate-tashkent-rp/">O\u2018yinni ochish</a></p>'
              '<script>location.replace("/ultimate-tashkent-rp/")</script></body></html>'
          )
          (root / "404.html").write_text(fallback, encoding="utf-8")
          assert (release / "index.html").stat().st_size > 100
          PY
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
